<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100">
  <title>Natal Solidário · Creche Comunitária Mundo Infantil</title>
  <!--
    Redrawn from the creche's logo (a ring of children holding hands around a heart with a key),
    as a vector so it stays sharp at any size.
  -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#1f4f36"/>
      <stop offset="1" stop-color="#0c1d15"/>
    </radialGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5483c"/>
      <stop offset="1" stop-color="#b02e25"/>
    </linearGradient>
    <!-- One child at the top of the ring, arms out to the neighbours, head pointing outwards. -->
    <g id="kid">
      <circle cx="50" cy="9.5" r="3.7"/>
      <path d="M42.4 13.2Q50 11.7 57.6 13.2Q58.6 13.5 58.3 14.6Q58 15.5 57 15.4Q54.4 15 52.9 15.7L55.3 24.2Q55.5 25 54.7 25H45.3Q44.5 25 44.7 24.2L47.1 15.7Q45.6 15 43 15.4Q42 15.5 41.7 14.6Q41.4 13.5 42.4 13.2Z"/>
    </g>
  </defs>

  <rect width="100" height="100" rx="24" fill="url(#bg)"/>

  <!-- the ring of joined hands -->
  <circle cx="50" cy="50" r="36.1" fill="none" stroke="#e2b456" stroke-width="2.4"/>
  <g fill="#e2b456">
    <use xlink:href="#kid"/>
    <use xlink:href="#kid" transform="rotate(30 50 50)"/>
    <use xlink:href="#kid" transform="rotate(60 50 50)"/>
    <use xlink:href="#kid" transform="rotate(90 50 50)"/>
    <use xlink:href="#kid" transform="rotate(120 50 50)"/>
    <use xlink:href="#kid" transform="rotate(150 50 50)"/>
    <use xlink:href="#kid" transform="rotate(180 50 50)"/>
    <use xlink:href="#kid" transform="rotate(210 50 50)"/>
    <use xlink:href="#kid" transform="rotate(240 50 50)"/>
    <use xlink:href="#kid" transform="rotate(270 50 50)"/>
    <use xlink:href="#kid" transform="rotate(300 50 50)"/>
    <use xlink:href="#kid" transform="rotate(330 50 50)"/>
  </g>

  <!-- the heart, with the key -->
  <path d="M50 71.5C33 60.5 28.5 51 31.6 43.2C34.8 35.6 44.6 34.6 50 42C55.4 34.6 65.2 35.6 68.4 43.2C71.5 51 67 60.5 50 71.5Z" fill="url(#heart)"/>
  <path d="M36.5 44.5C38 40.6 42 39.4 45 40.8" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.6" stroke-linecap="round"/>
  <g fill="none" stroke="#f6efe2" stroke-width="2.4" stroke-linecap="round">
    <circle cx="42" cy="51.5" r="4.2"/>
    <path d="M46.2 51.5H60M56.4 51.5V55M60 51.5V56"/>
  </g>
</svg>
